<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Raspberry Pi architecture: management and application planes</title>
<desc>A laptop connects to a Raspberry Pi 4 by two paths. SSH terminates at sshd on the host operating system. HTTP terminates inside Docker containers running RStudio Server and JupyterLab, both bind mounting storage from an SSD.</desc>

<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="250" y="30" width="420" height="400" rx="18" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text x="460" y="58" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Raspberry Pi 4</text>
<text x="460" y="76" text-anchor="middle" font-size="12" fill="#5F5E5A">Ethernet, local network</text>

<rect x="274" y="100" width="372" height="52" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
<text x="460" y="122" text-anchor="middle" font-size="14" font-weight="500" fill="#4B1528">sshd on host OS</text>
<text x="460" y="140" text-anchor="middle" font-size="12" fill="#993556">Management plane, port 22</text>

<rect x="274" y="182" width="372" height="132" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="460" y="204" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">Docker engine</text>

<rect x="292" y="222" width="168" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="376" y="245" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">RStudio Server</text>
<text x="376" y="265" text-anchor="middle" font-size="12" fill="#0F6E56">Port 8787</text>

<rect x="474" y="222" width="154" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="551" y="245" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">JupyterLab</text>
<text x="551" y="265" text-anchor="middle" font-size="12" fill="#0F6E56">Port 8888</text>

<line x1="376" y1="286" x2="376" y2="342" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<line x1="551" y1="286" x2="551" y2="342" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>

<rect x="274" y="346" width="372" height="60" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="460" y="369" text-anchor="middle" font-size="14" font-weight="500" fill="#412402">SSD at /mnt/ssd</text>
<text x="460" y="389" text-anchor="middle" font-size="12" fill="#854F0B">ext4, bind mounted</text>

<rect x="30" y="188" width="122" height="62" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="91" y="211" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Laptop</text>
<text x="91" y="231" text-anchor="middle" font-size="12" fill="#5F5E5A">Wi-Fi</text>

<line x1="154" y1="204" x2="270" y2="128" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="194" y="150" text-anchor="middle" font-size="12" fill="#5F5E5A">SSH 22</text>

<line x1="154" y1="238" x2="270" y2="248" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="198" y="278" text-anchor="middle" font-size="12" fill="#5F5E5A">HTTP 8787, 8888</text>
</svg>
